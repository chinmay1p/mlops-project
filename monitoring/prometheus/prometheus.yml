global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'finguard-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:4000']

  - job_name: 'finguard-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
